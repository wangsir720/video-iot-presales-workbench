# GB/T 28181 接入预检配置（示例）
#
# 重要说明：
# - 国标 ID 第 11-13 位为「类型编码」，其取值随所接入平台的设备目录与行业约定不同。
#   本文件只提供一组**示例值**用于演示校验逻辑，不构成标准取值。实际使用时请按项目
#   平台侧的设备目录约定替换下面的 allowed_type_codes。
# - 中心编码（8 位）与行业编码（2 位）同样按项目实际分配填写。

# 生成设备接入清单时使用的中心编码 / 行业编码（示例）
center_code: "33010600"
industry_code: "00"

# 平台设备目录允许的类型编码（示例，请按实际平台替换）
allowed_type_codes:
  - "131"
  - "132"
  - "215"
