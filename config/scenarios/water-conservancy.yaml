sid: water-conservancy
name: 某河道水利智慧监管与防溺水预警
site: 华中 · 河道 8 km + 3 座闸站
client_type: 政府（水利/河湖监管）
objective: 河道非法采砂与倾倒监测、危险水域人员闯入预警、水位尺远端复核
record_days: 90
requirements:
  - 河道全长 8 km，重点河段需要 24 小时视频覆盖
  - 危险水域（深水区、闸口）需要人员闯入即时告警
  - 夜间与雨雾天气仍要求可用，需要热成像补充
  - 视频留存不少于 90 天，满足水利监管留痕要求
extras:
  - 与水位、雨量监测数据联动，做汛期加密巡测
points:
  - {pid: P01, purpose: 深水区人员闯入预警, product_sku: TH-256-2M, quantity: 3, stream_mbps: 3.0, distance_m: 200, env: outdoor, zone: 深水区}
  - {pid: P02, purpose: 河道非法作业监测, product_sku: IPC-B6-6M, quantity: 8, stream_mbps: 6.0, distance_m: 90, env: outdoor, zone: 河道}
  - {pid: P03, purpose: 闸站全景巡查, product_sku: PTZ-25X-4M, quantity: 3, stream_mbps: 8.0, distance_m: 150, env: outdoor, zone: 闸站}
rules:
  - {rid: R1, kind: polygon, name: 深水区禁入, zone: [[0.2,0.5],[0.8,0.5],[0.8,0.95],[0.2,0.95]], classes: [person]}
  - {rid: R2, kind: polygon, name: 采砂作业区, zone: [[0.1,0.55],[0.6,0.55],[0.6,0.9],[0.1,0.9]], classes: [vehicle, person]}
  - {rid: R3, kind: line, name: 闸口警戒线, line: [[0.1,0.65],[0.9,0.65]], classes: [person]}
